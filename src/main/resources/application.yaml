spring:
  application:
    name: sactions-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sactions_service}
    username: ${DB_USERNAME:sactions_service}
    password: ${DB_PASSWORD:sactions_service}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

open-sanctions:
  api-key: ${OPENSANCTIONS_API_KEY:ca83046aa24315015ed3832290ef213d}
  algorithm: logic-v2
  threshold: 0.8
  topics: sanction,sanction.linked,debarment,role.pep
