services:

  sactions-service:
    image: ${DOCKERHUB_USERNAME}/sactions-service:latest
    container_name: sactions-service
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: ${SERVER_PORT}
    ports:
      - "${SACTIONS_SERVICE_PORT}:${SERVER_PORT}"
    networks:
      - app-net
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${SERVER_PORT}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-net:
    external: true
